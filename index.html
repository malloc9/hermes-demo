<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator | Hermes Demo</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>✨ Random Quote Generator</h1>
    
    <!-- Quote Card -->
    <div class="quote-card">
      <span class="quote-category">General</span>
      
      <p class="quote-text">"Click the button below to get your first quote!"</p>
      
      <h3 class="quote-author">— Hermes Demo</h3>
      
      <!-- Loading Spinner -->
      <div class="spinner"></div>
    </div>
    
    <!-- Control Buttons -->
    <div class="buttons">
      <button id="new-quote-btn" class="btn btn-primary">
        🔄 New Quote
      </button>
      
      <button id="copy-btn" class="btn btn-secondary">
        📋 Copy Quote
      </button>
      
      <button id="share-btn" class="btn btn-secondary">
        🐦 Share on Twitter
      </button>
      
      <button id="favorite-btn" class="btn btn-favorite">
        🤍 Favorite
      </button>
      
      <button id="dark-mode-btn" class="btn btn-dark">
        🌙 Dark Mode
      </button>
    </div>
    
    <!-- Favorites List -->
    <div class="favorites-list">
      <h3>❤️ Your Favorites</h3>
      <div id="favorites-container">
        <p>No favorites yet. Click the 🤍 button to add some!</p>
      </div>
    </div>
  </div>
  
  <!-- Load local quotes array -->
  <script src="data/quotes.js"></script>
  
  <!-- Main JavaScript -->
  <script src="script.js"></script>
</body>
</html>
